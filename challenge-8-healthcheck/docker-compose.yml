version: '3.8'

services:
  app:
    build: .
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
    # Problème : depends_on simple démarre le conteneur mais n'attend pas que Redis soit prêt
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    # Manque : Configuration du healthcheck pour vérifier la disponibilité réelle du serveur
